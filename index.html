<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Deadline Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Conference Deadline Tracker</h1>
            <p>Track paper submission deadlines, abstract dates, and notification dates</p>
        </header>

        <section class="controls">
            <div class="conference-selector">
                <label for="conference-filter">Filter by Conference:</label>
                <select id="conference-filter">
                    <option value="all">All Conferences</option>
                </select>
            </div>
        </section>

        <section class="timeline-container">
            <div id="timeline-chart"></div>
        </section>

        <section class="legend">
            <h3>Legend</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="color-box blue"></span>
                    <span>Paper Submission Start</span>
                </div>
                <div class="legend-item">
                    <span class="color-box orange"></span>
                    <span>Abstract Deadline</span>
                </div>
                <div class="legend-item">
                    <span class="color-box purple"></span>
                    <span>Notification/End Date</span>
                </div>
                <div class="legend-item">
                    <span class="color-box today"></span>
                    <span>Today</span>
                </div>
            </div>
        </section>

        <section class="workshop-list">
            <h2>Workshops & Tracks</h2>
            <div id="workshop-list-container"></div>
        </section>
    </div>


    <script src="app.js"></script>
</body>
</html>
