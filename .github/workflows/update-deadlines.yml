name: Update Conference Deadlines

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit changes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the job dispatch the Pages deploy (pushes made with GITHUB_TOKEN do not trigger it)

concurrency:
  group: update-deadlines
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung site must not burn the default 6 hours
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          playwright install chromium --with-deps

      - name: Run deadline scraper
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          else
            FLAGS=""
          fi
          python scripts/scrape_deadlines.py --all --discover --validate $FLAGS 2>&1 | tee scrape.log
          {
            echo '### Deadline scraper'
            echo '```'
            tail -n 120 scrape.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild static assets and conference pages
        run: python scripts/build_static_data.py

      - name: Commit and push changes if any
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # app.js is included because the build syncs CONFERENCE_METADATA into it
          git add config/ data/ conferences/ app.js
          if git diff --cached --quiet; then
            echo "No changes detected. Working tree clean."
          else
            git commit -m "Auto-update conference deadlines and pages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly
            gh workflow run pages.yml --ref main
          fi
