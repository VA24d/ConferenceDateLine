name: Update Conference Deadlines

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit changes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests beautifulsoup4

      - name: Run deadline scraper
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/scrape_deadlines.py --all --dry-run
          else
            python scripts/scrape_deadlines.py --all
          fi

      - name: Rebuild static assets and conference pages
        run: python scripts/build_static_data.py

      - name: Commit and push changes if any
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add config/ data/ conferences/
            git commit -m "Auto-update conference deadlines and pages [skip ci]"
            git push
          else
            echo "No changes detected. Working tree clean."
          fi

